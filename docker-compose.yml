services:
  mariadb:
    image: mariadb:10.11
    container_name: vultaic-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change_this_root_password}
      MARIADB_USER: ${VULTAIC_DB_USER:-vultaic}
      MARIADB_PASSWORD: ${VULTAIC_DB_PASSWORD:-vultaic_dev_password}
      MARIADB_DATABASE: v_accounts
    ports:
      - "127.0.0.1:${VULTAIC_DB_PORT:-3306}:3306"
    volumes:
      - vultaic_db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4
    container_name: vultaic-adminer
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"

volumes:
  vultaic_db_data:

